name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Routine check'
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run unit tests with coverage
      run: |
        dotnet test KanbanTests \
        --configuration Release \
        --collect:"XPlat Code Coverage" \
        --logger "trx;LogFileName=unit-tests.trx"

    - name: Run tests with report and coverage
      run: |
        dotnet test KanbanIntegrationTests \
        --configuration Release \
        --collect:"XPlat Code Coverage" \
        --logger "trx;LogFileName=integration-tests.trx" \
        /p:Threshold=80 \
        /p:ThresholdType=line \
        /p:ThresholdStat=total
        
      env:
        SuperSecretJwtKey: supersecretkey12345678901234567890
        Issuer: MyKanbanTaskApp
        Audience: MyKanbanTaskApp

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'

    - name: Debug coverage output
      run: |
        echo "==== TestResults structure ===="
        find . -type d -name "TestResults"

        echo "==== ALL cobertura files ===="
        find . -name "coverage.cobertura.xml" || true

        echo "==== unit test coverage ===="
        find ./KanbanTests -name "coverage.cobertura.xml" || true

        echo "==== integration test coverage ===="
        find ./KanbanIntegrationTests -name "coverage.cobertura.xml" || true

    - name: Upload raw coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-raw
        path: '**/coverage.cobertura.xml'

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator \
        -reports:"**/coverage.cobertura.xml" \
        -targetdir:"coverage-report" \
        -reporttypes:Html
        -assemblyfilters:"+Kanban*;-Microsoft*;-System*" \
        -classfilters:"-*.Generated*;-System.*;-Microsoft.*" \
        -filefilters:"-*.g.cs;-*.designer.cs;-*DesignTimeDbContextFactory.cs"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      run: |
        docker build -t dijenek91/kanban-api:${{ github.sha }} ./KanbanRestService
        docker push dijenek91/kanban-api:${{ github.sha }}