name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests with report and coverage
      run: |
        dotnet test --no-build --configuration Release \
        --collect:"XPlat Code Coverage" \
        --logger "trx;LogFileName=test-results.trx"            
      env:
        SuperSecretJwtKey: supersecretkey12345678901234567890
        Issuer: MyKanbanTaskApp
        Audience: MyKanbanTaskApp

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'

    - name: Debug coverage output
      run: |
          echo "==== TestResults structure ===="
          find . -type d -name "TestResults"
          echo "==== cobertura files ===="
          find . -name "*.cobertura.xml" || true

    - name: Upload raw coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-raw
        path: '**/coverage.cobertura.xml'

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator \
        -reports:"TestResults/coverage/coverage.cobertura.xml"
        -targetdir:"coverage-report" \
        -reporttypes:Html

    - name: Debug coverage output 2
      run: |
          echo "==== TestResults structure ===="
          find . -type d -name "TestResults"
          echo "==== cobertura files ===="
          find . -name "*.cobertura.xml" || true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'